# Isolated verification for the skydiver beta (#147).
#
# GitHub Actions is disabled for this repository; this definition does not run until
# the owner enables Actions. It needs no secrets and uses only GitHub-hosted runners
# and a PostgreSQL service container. Every job calls scripts/verify.sh, which is
# the same command contributors run locally (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  VERIFY_PG_HOST: 127.0.0.1
  VERIFY_PG_PORT: "5432"
  VERIFY_PG_USER: postgres
  # Only reachable inside the job; not a secret.
  VERIFY_PG_PASSWORD: verify-only
  VERIFY_PG_DISPOSABLE: "yes"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: scripts/verify.sh backend

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/verify.sh web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: scripts/verify.sh e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
