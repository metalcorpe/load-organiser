name: Task
description: A scoped piece of work with an outcome and checkable acceptance criteria.
labels: ["type:task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this is done?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checkable items. Say how each is verified.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must be complete first (for example "- #146").
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and validation
      description: Record concrete checks and remaining limitations when completing it.
      value: Not implemented or tested yet.
