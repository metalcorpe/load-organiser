[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.15,<4.0"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "python-multipart>=0.0.33",
    "email-validator>=2.3.0",
    "tenacity>=9.2.1",
    "pydantic>=2.14.3",
    "emails>=1.1.3",
    "jinja2>=3.1.6",
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "sqlmodel>=0.0.48",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "bcrypt>=5.0.0",
    "pydantic-settings>=2.16.2",
    "sentry-sdk[fastapi]>=2.74.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
    "pre-commit>=4.7.0",
    "coverage>=7.17.2",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py315"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
# Legacy models shared with the beta (User). Kept as-is: unquoting the SQLModel
# relationship forward references or switching the str enums to StrEnum would
# change legacy runtime behaviour, which is #166 territory.
"app/models.py" = ["UP037", "UP042"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
